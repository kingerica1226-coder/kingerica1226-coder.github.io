<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Themed-Gallery</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div id="centered-hero">
            <div id="hero-content">
                <h1> The Wild's of Arizona</h1>
                <h3> From canyons to mountains </h3>
            </div>
        </div>
        <div id="layout">
            <div class="border">
                <div class="gallery">
                    <img src="images/canyon-2.jpg" alt="canyon">
                    <img src="images/canyon-4.jpg" alt="canyon">
                    <img src="images/canyon-3.jpg" alt="canyon">
                    <img src="images/lake-1.jpg" alt="canyon">
                    <img src="images/mountain-1.jpg" alt="daytime mountains">
                    <img src="images/lake-2.jpg" alt="lake">
                    <img src="images/sunset.jpg" alt="sunset mountains">
                    <img src="images/mountain-2.jpg" alt="night mountains">
                    <img src="images/mountain-3.jpg" alt="stars and mountains">  
                </div>
            </div>
        </div>  
    </body>
</html>
