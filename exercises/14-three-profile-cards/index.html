<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>three profile cards</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div class="single-column">
            <div class="card-container">
                <div id="card1" class="card">
                    <h3>Oscar</h3>
                    <img src="images/oscar.jpg" alt="Oscar">
                    <p>The loveable hoarder.</p>
                    <div class="button">
                        <a href="#">View Profile</a>
                    </div>
                </div>
                <div id="card2" class="card">
                    <h3>Evie</h3>
                    <img src="images/evie.jpg" alt="Evie">
                    <p>
                        The crazy acrobat.
                    </p>
                    <div class="button">
                        <a href="#">View Profile</a>
                    </div>
                </div>
                <div id="card3" class="card">
                    <h3>Penny and Pearl</h3>
                    <img src="images/penny-pearl.jpg" alt="Penny and Pearl">
                    <p> Sisters, Friends, Loners</p>
                    <div class="button">
                        <a href="#">View Profile</a>
                    </div>
                </div>
            </div>
        </div> 
    </body>
</html>
