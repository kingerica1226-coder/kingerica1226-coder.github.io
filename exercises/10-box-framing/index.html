<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Framing </title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <img
            src="images/legs.jpg"
            alt="legs"
            id="legs"
        >
        <div class="frame">
            <div class="frame4">
                <img 
                    id="wedding"
                    src="images/wedding.jpg"
                    alt="girl in a mirror"
                    id="wedding"
                >
            </div>
        </div>
        <div id="frame3">
            <img
                src="images/face.jpg"
                alt="girl hugging face"
                id="face"
            >
        </div>
        <div class="frame">
            <div class="frame4">
                <p id="slogan">
                    Changing relationship status to legally bound.
                </p>
            </div>
        </div>
    </body>
</html>
