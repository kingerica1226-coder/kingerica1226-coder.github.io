<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Product Page</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div id="header">
            <h1> mebay </h1>
        </div>
        <div id="layout">
            <div id="thumbnail-column">
                <div id="gallery">
                    <img 
                        id="thumbnail1"
                        src="images/blanket-img1.webp"
                        alt="Wonman holding a blanket"
                    >
                    <img 
                        src="images/blanket-img2.webp"
                        alt="blanket texture close up"
                    >
                    <img 
                        src="images/blanket-img3.webp"
                        alt="blanket on a bed"
                    >
                    <img 
                        src="images/blanket-img4.webp" 
                        alt="woman curled up in a blanket"
                    >
                    <img 
                        src="images/blanket-img5.webp"
                        alt="blanket on a bed tan"
                    >
                    <img 
                        src="images/blanket-img6.webp"
                        alt="blanket folded on a table"
                    >
                    <img 
                        src="images/blanket-img7.webp"
                        alt="measurements of the blanket"
                    >
                    <img 
                        src="images/blanket-img8.webp"
                        alt="woman in blanket blue"
                    >
                </div>

            </div>
            <div id="feautred-image-column">
                <img 
                    src="images/s-l1600.webp"
                    alt="Wonman holding a blanket"
                >
            </div>
            <div id="product-info-column">
                <div id="product-info">
                    <h2> 
                        Soft Faux Rabbit Fur&Sherpa Throw Blanket,
                        Microfiber Blanket,Fleece Blanket
                    </h2>
                    <div id="seller-info-card">
                        <div id="seller-info-card-body">
                            <div id="seller-profile-image"> 
                                <img 
                                    src="images/profile1.webp"
                                    alt="profile image of the seller"
                                >
                            </div>
                            <div id="seller-body">
                                <div id="seller-name-text">
                                    <h5>
                                        <a href="#"> TreasureTrove Express </a>
                                        <span class="light-text">(515)</span>
                                    </h5>
                                </div>
                                <div id="seller-info">
                                    <div id="seller-rating"> 
                                        <a href="#"> 97.8% positive </a>
                                    </div>
                                    <div id="seller-pages">
                                        <a href="#"> Seller's Other Items </a>
                                    </div>
                                    <div id="seller-message"> 
                                        <a href="#"> Message Seller </a>
                                    </div>
                                </div>
                            </div>
                           
                        </div>
                    </div>    
                    <h4>US $15.99 </h4>
                    <p> 
                        <span class="text-header"> Condition:</span>
                        New with tags
                    </p>
                    <div id="product-actions">
                        <ul>
                            <li>
                                <a href="#" id="buy-it-now">
                                    Buy it Now 
                                </a>
                            </li>
                            <li>
                                <a href="#" id="add-to-cart"> 
                                    Add to Cart 
                                </a>
                            </li>
                            <li>
                                <a href="#" id="add-to-wishlist"> 
                                    Add to Wishlist
                                </a>
                            </li> 
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
</html>
