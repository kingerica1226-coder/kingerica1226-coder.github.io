<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photos By Jim</title>
        <link href="css/style.css" rel="stylesheet">    
    </head>
    <body>
        <div id="nav-background">
            <div id="nav">
                <a href="#" id="logo">Photos by Jim</a>
                <a href="#">Gallery</a>
                <a href="#">Services</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </div>
        <div id="hero">
            <div id="hero-content">
                <h1> Photos By Jim</h1>
                <a href="#gallery-title" class="button">View Gallery</a>
            </div>
        </div>
        <div id="gallery-layout">
            <h2 id="gallery-title"> Gallery</h2>
            <div id="gallery">
                <img 
                    src="images/hi-res/gallery-work/urban-9mb73.jpg"
                    alt="man walking in alley"
                >
                <img 
                    src="images/hi-res/gallery-work/urban-5sn81.jpg"
                    alt="new york with snow"
                >
                <img 
                    src="images/hi-res/gallery-work/urban-6s8s8.jpg"
                    alt="chinatown at night"
                >
                <img
                    src="images/hi-res/gallery-work/urban-8zu9s.jpg"
                    alt="storage facility"
                >
                <img
                    src="images/hi-res/gallery-work/urban-12w82.jpg"
                    alt="newyork cabs on street light"
                >
                <img 
                    src="images/hi-res/gallery-work/urban-16ij4.jpg"
                    alt="subway"
                >
                <img 
                    src="images/hi-res/gallery-work/urban-17c5x.jpg"
                    alt="subway tunnel"
                >
                <img    
                    src="images/hi-res/gallery-work/urban-18q12.jpg"
                    alt="street at night"
                >
                <img
                    src="images/hi-res/gallery-work/urban-20vb1.jpg"
                    alt="Newyork snow at night"
                >   
            </div>
        </div>
        <div id="layout">
            <div id="card-container">
                <div class="card">
                    <h4> About</h4>
                    <div class="image">
                        <img 
                            src="images/hi-res/gallery-work/urban-13n8n.jpg"
                            alt="image"
                        >
                    </div>
                    <a href="#" class="button two">Learn More</a>
                </div>
                <div class="card">
                    <h4> Services</h4>
                    <div class="image">
                        <img 
                            src="images/hi-res/gallery-work/urban-1a4h3.jpg"
                            alt="image"
                        >
                    </div>
                    <a href="#" class="button two">View Rates</a>
                </div>
                <div class="card">
                    <h4> Contact </h4>
                    <div class="image">
                        <img 
                            src="images/hi-res/gallery-work/urban-19po9.jpg"
                            alt="image"
                        >
                    </div>
                    <a href="#" class="button two">Reach Out</a>
                </div>
            </div>
        </div>
    </body>
</html>
