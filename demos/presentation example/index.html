<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Presentation Brief | Erica King Studio</title>
    <style>
        /* DESIGN ACCENT BRAND VARIABLES */
        :root {
            --white: #FFFFFF;
            --linen: #DBCCD1;      /* Pale Linen Accents */
            --navy: #1D2432;       /* Midnight Navy Brand Identity */
            --crimson: #6A0F12;    /* Deep Crimson Actions & Signposts */
            --burgundy: #3B0F15;   /* Dark Burgundy Typographic Accent */
            --rust: #784A3A;       /* Rust Clay Editorial Details */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--white);
            color: var(--navy);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 8rem;
        }

        h1, h2, h3, h4 {
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: var(--navy);
        }

        p {
            color: #4A5260;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        /* METADATA TOP BAR */
        .meta-header {
            max-width: 900px;
            margin: 4rem auto 0 auto;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--linen);
            padding-bottom: 1.5rem;
        }

        .studio-brand {
            display: flex;
            flex-direction: column;
        }

        .studio-name {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--navy);
        }

        .studio-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--rust);
            margin-top: 0.2rem;
        }

        /* EDITABLE INPUT FIELDS STYLING */
        input[type="text"], textarea {
            width: 100%;
            border: 1px solid transparent;
            background-color: #FAF8F8;
            font-family: inherit;
            font-size: 0.95rem;
            color: #4A5260;
            padding: 8px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--rust);
            background-color: var(--white);
            outline: none;
        }

        /* Top Header Metadata Inputs */
        .meta-input {
            text-align: right;
            background: transparent !important;
            color: var(--rust) !important;
            font-size: 0.8rem !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 250px !important;
        }

        .presentation-title h1 input {
            font-family: 'Georgia', serif;
            font-size: 2.8rem;
            color: var(--navy);
            background: transparent;
            padding: 0;
        }

        /* DOCUMENT CONTAINER */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* INTRO TITLE */
        .presentation-title {
            padding: 5rem 0 3rem 0;
        }

        .presentation-title .phase {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--crimson);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* BRIEF STRATEGY GRID */
        .brief-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            margin-bottom: 5rem;
            padding: 2.5rem;
            background-color: #FAF8F8;
            border-left: 3px solid var(--rust);
        }

        .brief-item h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--navy);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        textarea.brief-text {
            height: 120px;
            resize: none;
            line-height: 1.5;
            background: transparent;
        }

        /* PRESENTATION CONTENT SECTION */
        .section-break {
            border-bottom: 1px solid var(--rust);
            margin: 4rem 0 2rem 0;
            padding-bottom: 0.5rem;
        }

        .section-break h2 {
            font-size: 1.6rem;
            color: var(--burgundy);
        }

        /* CONCEPT DISCOVERY ARCHITECTURE */
        .concept-showcase {
            margin: 3rem 0 6rem 0;
        }

        .concept-meta {
            margin-bottom: 1.5rem;
        }

        .concept-number {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rust);
            font-weight: bold;
        }

        /* LOGO CANVAS MOCKUP PLACEHOLDER */
        .logo-canvas-container {
            background-color: var(--navy); 
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-artwork-window {
            border: 1px dashed var(--linen);
            width: 85%;
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--linen);
            font-family: 'Georgia', serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        textarea.rationale-text {
            height: 110px;
            resize: none;
            font-size: 1rem;
            line-height: 1.6;
            margin-top: 0.5rem;
        }

        /* CLIENT FOOTER ACTION BLOCK */
        .next-steps-box {
            border: 1px solid var(--linen);
            padding: 3rem;
            margin-top: 6rem;
            text-align: center;
        }

        .next-steps-box h3 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .next-steps-box p {
            max-width: 500px;
            margin: 0 auto 2rem auto;
        }

        .feedback-action {
            display: inline-block;
            background-color: var(--crimson);
            color: var(--white);
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .feedback-action:hover {
            background-color: var(--burgundy);
        }

        /* PRINT EXPORT SETTINGS */
        @media print {
            input[type="text"], textarea { background-color: transparent !important; padding: 0; border: none; }
            .logo-canvas-container { border: 1px solid var(--navy); }
        }
    </style>
</head>
<body>

    <!-- DOCUMENT TOP META BAR -->
    <div class="meta-header">
        <div class="studio-brand">

    </div>

    <div class="container">
        
        <!-- COVER HEADER TITLE -->
        <section class="presentation-title">

        <section class="section-break">

        <!-- DIRECTION CONCEPT 01 -->
        <div class="concept-showcase">
            <div class="concept-meta">

            <div class="logo-canvas-container">

                </div>
            </div>

            <h4>Design Rationale:</h4>
